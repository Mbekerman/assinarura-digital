# Copie para signing-config.properties (NÃO versionado) e preencha.
# Cada chave também pode vir de variável de ambiente: safeid.baseUrl -> SAFEID_BASEURL.
#
# ATENÇÃO: os caminhos e nomes de campo abaixo seguem a API padronizada de PSCs da ICP-Brasil
# (DOC-ICP-17.01). Confirme cada valor na documentação do SafeID Integração
# (https://pscsafeweb.safewebpss.com.br/Docs/) e no painel https://admin-safeid.safeweb.com.br/.

# URL base da API do PSC Safeweb (informada na documentação/painel). Obrigatória.
safeid.baseUrl=
# client_id da aplicação cadastrada no painel (não é segredo).
safeid.clientId=
# URI de retorno cadastrada no painel. O app captura esse endereço.
safeid.redirectUri=assinapdf://oauth/callback
safeid.scope=signature_session
safeid.lifetime=900
# BROKER: o app troca o código no serviço intermediário (server/token-broker), que guarda o client_secret.
# DIRECT_PKCE: só se a Safeweb aceitar troca do código sem client_secret (cliente público com PKCE).
safeid.tokenMode=BROKER
safeid.brokerUrl=https://seu-servidor.exemplo/assinapdf
# Chave de acesso ao serviço intermediário (fica no APK; limita abuso, não é um segredo forte).
safeid.brokerKey=

# Caminhos relativos à URL base (padrão PSC ICP-Brasil, a confirmar)
safeid.path.authorize=v0/oauth/authorize
safeid.path.token=v0/oauth/token
safeid.path.certificateDiscovery=v0/oauth/certificate-discovery
safeid.path.signature=v0/oauth/signature
safeid.hashAlgorithmField=hash_algorithm

# Política de assinatura ICP-Brasil (opcional). Preencha somente com valores oficiais do ITI.
safeid.policy.oid=
safeid.policy.hashAlgorithmOid=
safeid.policy.hashBase64=
safeid.policy.uri=

# Assinatura do APK de release (opcional; sem isso o release usa a chave de debug)
release.storeFile=
release.storePassword=
release.keyAlias=
release.keyPassword=
