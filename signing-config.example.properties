# Copie para signing-config.properties (NÃO versionado) e preencha.
# Cada chave também pode vir de variável de ambiente: safeid.baseUrl -> SAFEID_BASEURL.
#
# Todos os valores abaixo já têm padrão em app/build.gradle.kts (API conferida na documentação
# oficial: https://pscsafeweb.safewebpss.com.br/Docs/). Preencha só o que quiser trocar.

# safeid.baseUrl=https://pscsafeweb.safewebpss.com.br/Service/Microservice/OAuth/api/v0/oauth
# safeid.clientId=assinapdf-rixiycui
# Endereço do servidor de retorno (server/retorno, no Cloud Run). Sem padrão: obrigatório para assinar.
# Dele saem o retorno (<url>/oauth/callback) e a troca do token (<url>/v1/token).
safeid.serverUrl=
# safeid.redirectUri=<serverUrl>/oauth/callback
# safeid.scope=signature_session
# Validade do token em segundos (7 dias = 604800, o máximo para pessoa física).
# safeid.lifetime=604800
# BROKER: o app troca o código no servidor de retorno, que guarda o client_secret.
# safeid.tokenMode=BROKER
# safeid.brokerUrl=<serverUrl>
# Chave de acesso ao servidor de retorno (segredo assinapdf-broker-key). Sem padrão: obrigatória.
safeid.brokerKey=

# Caminhos relativos à URL base
# safeid.path.authorize=authorize
# safeid.path.token=token
# safeid.path.certificateDiscovery=certificate-discovery
# safeid.path.signature=signature
# safeid.hashAlgorithmField=hash_algorithm

# Política de assinatura ICP-Brasil. Vazio = PAdES AD-RB v1.3 oficial (docs/SAFEID.md).
# Preencha somente para trocar por outra política, com valores oficiais do ITI.
safeid.policy.oid=
safeid.policy.hashAlgorithmOid=
safeid.policy.hashBase64=
safeid.policy.uri=

# Assinatura do APK de release (opcional; sem isso o release usa a chave de debug)
release.storeFile=
release.storePassword=
release.keyAlias=
release.keyPassword=
