name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes JVM (geometria, assinatura PAdES, motor de PDF)
        run: ./gradlew --no-daemon :core:stamps:test :core:signing:test :verify:pdf-jvm:test

      - name: Preparar chave fixa de assinatura
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinapdf-release.p12"
            echo "RELEASE_STOREFILE=$RUNNER_TEMP/assinapdf-release.p12" >> "$GITHUB_ENV"
            echo "Chave fixa configurada."
          else
            echo "Sem RELEASE_KEYSTORE_BASE64: o APK de release usa a chave de debug e não será publicado."
          fi

      # A chave do app precisa ser a mesma guardada no servidor (BROKER_KEY). Com a chave errada, a
      # assinatura falha na troca do código e o APK publicado não assina. Um código falso basta para
      # conferir: com a chave certa o servidor repassa ao PSC (que recusa o código, HTTP 400); com a
      # chave errada responde 401 sem chamar o PSC.
      - name: Conferir a chave do app no servidor de retorno
        if: github.event_name != 'pull_request'
        env:
          SAFEID_SERVERURL: ${{ vars.SAFEID_SERVERURL }}
          SAFEID_BROKERKEY: ${{ secrets.SAFEID_BROKERKEY }}
        run: |
          if [ -z "$SAFEID_SERVERURL" ] || [ -z "$SAFEID_BROKERKEY" ]; then
            echo "::warning::SAFEID_SERVERURL ou SAFEID_BROKERKEY ausente: chave não conferida."
            exit 0
          fi
          URL="${SAFEID_SERVERURL%/}"
          BODY=$(printf '{"code":"ci-conferencia","code_verifier":"ci-conferencia","redirect_uri":"%s/oauth/callback"}' "$URL")
          CODE=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' -X POST "$URL/v1/token" \
            -H 'Content-Type: application/json' -H "X-AssinaPDF-Key: $SAFEID_BROKERKEY" -d "$BODY")
          echo "Servidor respondeu HTTP $CODE"
          case "$CODE" in
            400) echo "Chave do app aceita pelo servidor." ;;
            401) echo "::error::SAFEID_BROKERKEY não confere com a chave do servidor (Secret Manager: assinapdf-broker-key)."; exit 1 ;;
            *) echo "::warning::Resposta inesperada do servidor de retorno; chave não conferida." ;;
          esac

      - name: APK e testes unitários do app
        env:
          RELEASE_STOREPASSWORD: ${{ secrets.RELEASE_STOREPASSWORD }}
          # Opcionais: padrão alias "assinapdf" e senha da chave igual à do arquivo
          RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          RELEASE_KEYPASSWORD: ${{ secrets.RELEASE_KEYPASSWORD }}
          # Endereço do servidor de retorno (server/retorno no Cloud Run): variável do repositório, não segredo.
          SAFEID_SERVERURL: ${{ vars.SAFEID_SERVERURL }}
          # client_id da aplicação no painel da Safeweb; sem a variável, vale o padrão do build.
          SAFEID_CLIENTID: ${{ vars.SAFEID_CLIENTID }}
          # Chave de acesso ao servidor de retorno (segredo assinapdf-broker-key no Secret Manager).
          # URL base da API e client_id do SafeID já têm padrão em app/build.gradle.kts.
          SAFEID_BROKERKEY: ${{ secrets.SAFEID_BROKERKEY }}
        run: |
          if [ -z "$SAFEID_SERVERURL" ]; then
            echo "::warning::Variável SAFEID_SERVERURL não definida: o APK é gerado, mas a assinatura fica indisponível."
          fi
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:assembleDebugAndroidTest

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: assinapdf-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar PDFs gerados nos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-de-teste
          path: verify/pdf-jvm/build/test-pdfs/
          if-no-files-found: ignore

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Testes instrumentados (emulador)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Publicar relatórios instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-instrumentados
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  publicar:
    name: Publicar APK de teste
    needs: [build, instrumented]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assinapdf-apk
          path: apk
      - name: Conferir a chave do APK
        id: chave
        env:
          # Impressão digital SHA-256 da chave fixa; a mesma está no assetlinks.json do server/retorno.
          ESPERADA: "9A:C8:BB:93:B4:37:99:48:82:41:CF:7F:AD:EC:00:9C:08:8F:A5:C0:96:32:92:9C:EB:AC:48:47:13:8E:F4:67"
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ATUAL=$("$APKSIGNER" verify --print-certs apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Chave do APK: $ATUAL"
          if [ "$ATUAL" = "$ESPERADA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APK não assinado com a chave fixa (configure os segredos RELEASE_*). Release não atualizado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Atualizar o Release "apk-teste"
        if: steps.chave.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/release/app-release.apk AssinaPDF.apk
          gh release delete apk-teste --cleanup-tag --yes || true
          gh release create apk-teste AssinaPDF.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AssinaPDF - versão de teste" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}), depois de todos os testes passarem."
