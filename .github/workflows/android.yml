name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes JVM (geometria, assinatura PAdES, motor de PDF)
        run: ./gradlew --no-daemon :core:stamps:test :core:signing:test :verify:pdf-jvm:test

      - name: APK e testes unitários do app
        env:
          # Opcional: credenciais do SafeID Integração como segredos do repositório.
          SAFEID_BASEURL: ${{ secrets.SAFEID_BASEURL }}
          SAFEID_CLIENTID: ${{ secrets.SAFEID_CLIENTID }}
          SAFEID_TOKENMODE: ${{ secrets.SAFEID_TOKENMODE }}
          SAFEID_BROKERURL: ${{ secrets.SAFEID_BROKERURL }}
          SAFEID_BROKERKEY: ${{ secrets.SAFEID_BROKERKEY }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:assembleDebugAndroidTest

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: assinapdf-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar PDFs gerados nos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-de-teste
          path: verify/pdf-jvm/build/test-pdfs/
          if-no-files-found: ignore

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Testes instrumentados (emulador)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Publicar relatórios instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-instrumentados
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  publicar:
    name: Publicar APK de teste
    needs: [build, instrumented]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assinapdf-apk
          path: apk
      - name: Atualizar o Release "apk-teste"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/release/app-release.apk AssinaPDF.apk
          gh release delete apk-teste --cleanup-tag --yes || true
          gh release create apk-teste AssinaPDF.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AssinaPDF - versão de teste" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}), depois de todos os testes passarem. Assinatura SafeID ainda não configurada: o editor e o rascunho funcionam."
